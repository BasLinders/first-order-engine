[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foe"
version = "0.1.0"
description = "A comprehensive UI-agnostic library for A/B testing and statistical inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bas Linders", email = "bas_linders@hotmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# All core mathematical and engine dependencies
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "statsmodels>=0.13.0",
    "pydantic>=2.0.0",
    "pingouin>=0.5.3",
    "patsy>=0.5.3",
    "prophet>=1.1.4"
]

[project.optional-dependencies]
# Dependencies specifically for development/testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]
# foe.data's BigQuery/OAuth connectivity (DataEngine). Deliberately optional:
# foe's core stats engines never require these, and DataEngine itself raises
# a clear ImportError if it's instantiated without this extra installed.
bigquery = [
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-resource-manager>=1.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["foe*"]
# Prevents the test suite from being shipped in the built package
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=foe"

[tool.coverage.run]
omit = [
    "foe/behavioral/*",
    "foe/forecasting/*",
    "foe/interaction/*",
    "foe/pretest/*",
    "foe/sequential/*",
    "foe/srm/*",
    "foe/viz/*",
    # engine.py is a thin wrapper around the google-cloud-bigquery/
    # google-auth-oauthlib client libraries -- exercising it meaningfully
    # needs a live or heavily-mocked BigQuery backend. foe/data/sql/* (the
    # actual SQL-building logic) is pure and stays covered.
    "foe/data/engine.py",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pyright]
# Pyright/Pylance doesn't recognize a positional default passed to
# pydantic's Field(default, ...) as satisfying that constructor parameter
# under pydantic 2.13.x -- a confirmed false positive (the flagged calls
# construct correctly at runtime, defaults included; see any test_*.py
# file, which all omit defaulted fields as normal, idiomatic pydantic
# usage). Scoped to tests/, where these calls happen; foe/ itself never
# triggers this and keeps the check fully active.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportCallIssue = "none"
