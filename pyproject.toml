[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foe"
version = "0.1.0"
description = "A comprehensive UI-agnostic library for A/B testing and statistical inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bas Linders", email = "bas_linders@hotmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# All core mathematical and engine dependencies
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "statsmodels>=0.13.0",
    "pydantic>=2.0.0",
    "pingouin>=0.5.3",
    "patsy>=0.5.3",
    "prophet>=1.1.4"
]

[project.optional-dependencies]
# Dependencies specifically for development/testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "flask>=3.0",
    "functions-framework>=3.0.0",
]
# Dependencies specifically for GCP Cloud Functions
gcp = [
    "functions-framework>=3.0.0",
    "google-cloud-storage>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["foe*"]
# Prevents test/deployment folders from being shipped in the built package
exclude = ["tests*", "gcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=foe"

[tool.black]
line-length = 88
target-version = ['py310']
