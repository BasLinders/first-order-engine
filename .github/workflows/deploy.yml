name: Deploy Cloud Functions

on:
  workflow_run:
    workflows: ["Python Tests & Linting"]
    branches: [main]
    types:
      - completed

jobs:
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: foe-wheel
          path: dist/*.whl
          retention-days: 1

  deploy:
    name: Deploy API Endpoints
    needs: build  # Only depends on build, not test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - frequentist
          - bayesian
          - sequential
          - continuous
          - behavioral
          - interaction
          - pretest
          - srm

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: foe-wheel

      - name: Copy wheel to module directory
        run: cp *.whl gcp/functions/${{ matrix.module }}/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.module }} Function
        run: |
          gcloud functions deploy ${{ matrix.module }}-handler \
            --runtime=python310 \
            --region=us-central1 \
            --source=gcp/functions/${{ matrix.module }} \
            --entry-point=${{ matrix.module }}_handler \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512MB
