name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'foe/**'          # Re-deploy if core logic changes
      - 'gcp/functions/**'  # Re-deploy if wrappers change

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest
        run: pytest tests/

  deploy:
    name: Deploy API Endpoints
    needs: test
    runs-on: ubuntu-latest
    
    # Run entire job 8 times in parallel, substituting ${{ matrix.module }} with the current item in the list
    strategy:
      matrix:
        module: 
          - frequentist
          - bayesian
          - sequential
          - continuous
          - behavioral
          - interaction
          - pretest
          - srm

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build FOE Package (Wheel)
        run: |
          python -m pip install build
          python -m build
          # Copy the wheel into the specific module's deployment folder
          cp dist/foe-0.1.0-py3-none-any.whl gcp/functions/${{ matrix.module }}/

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy ${{ matrix.module }} Function
        run: |
          gcloud functions deploy ${{ matrix.module }}-handler \
            --runtime=python310 \
            --region=us-central1 \
            --source=gcp/functions/${{ matrix.module }} \
            --entry-point=${{ matrix.module }}_handler \
            --trigger-http \
            --allow-unauthenticated
            --memory=512MB
