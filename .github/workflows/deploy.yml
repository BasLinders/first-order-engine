name: Deploy Cloud Functions

on:
  workflow_run:
    workflows: ["Python Tests & Linting"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  # Only proceeds if the upstream test workflow succeeded.
  # 'completed' fires on success, failure, and cancellation — the if: guard
  # here ensures we never deploy from a broken test run.
  # workflow_dispatch is always allowed so the wheel can be rebuilt manually.
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4.3.0
        with:
          name: foe-wheel
          path: dist/*.whl
          retention-days: 1

  # ── 2. Deploy ─────────────────────────────────────────────────────────────
  # Deploys each function independently via fail-fast: false so a single
  # broken module directory does not cancel the remaining deployments.
  #
  # Only list modules that have a corresponding gcp/functions/{module}/
  # directory with a main.py and requirements.txt. Remove entries that are
  # not yet implemented to prevent spurious deploy failures.
  deploy:
    name: Deploy ${{ matrix.module }} Function
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Memory and timeout are set per-function based on expected load.
          # Bayesian and Sequential run heavy simulations; others are lightweight.
          - module: frequentist
            memory: 256MB
            timeout: 120s
          - module: bayesian
            memory: 1024MB
            timeout: 300s
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: foe-wheel

      - name: Copy wheel to module directory
        run: cp *.whl gcp/functions/${{ matrix.module }}/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.0

      - name: Deploy ${{ matrix.module }} Function
        run: |
          gcloud functions deploy ${{ matrix.module }}-handler \
            --gen2 \
            --runtime=python310 \
            --region=us-central1 \
            --source=gcp/functions/${{ matrix.module }} \
            --entry-point=${{ matrix.module }}_handler \
            --trigger-http \
            --memory=${{ matrix.memory }} \
            --timeout=${{ matrix.timeout }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated
