name: Python Tests & Linting

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'foe/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Opt into Node.js 24 ahead of the June 2026 forced migration.
# Affects all JavaScript-based actions (checkout, setup-python, git-auto-commit).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Auto-format ────────────────────────────────────────────────────────
  # Only runs on push events: git-auto-commit-action requires write access to
  # the target branch, which GITHUB_TOKEN does not have for fork PR branches.
  autoformat:
    name: Auto-fix Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install formatters
        run: pip install autopep8 autoflake

      - name: Remove unused variables
        # --remove-all-unused-imports is intentionally omitted: autoflake cannot
        # detect imports kept for side effects or re-exports (e.g. validator
        # imports used only inside Pydantic model_validator bodies).
        # Unused imports are caught and reported by flake8 (F401) in the lint job.
        run: |
          autoflake --in-place --recursive \
            --remove-unused-variables \
            .

      - name: Fix style issues
        # max-line-length matches the flake8 limit set in the lint job and in
        # setup.cfg / pyproject.toml so autopep8 and flake8 agree on line length.
        run: |
          autopep8 --in-place --recursive \
            --max-line-length 88 \
            --select W291,W293,W391,E302,E303,E261,E501 \
            .

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix flake8 cosmetic issues"

  # ── 2. Lint ───────────────────────────────────────────────────────────────
  # Runs after autoformat on push; runs directly on pull_request (no autoformat
  # commit is attempted on PRs, so lint checks the submitted code as-is).
  lint:
    name: Code Quality (Flake8)
    runs-on: ubuntu-latest
    needs:
      - autoformat
    if: |
      always() &&
      (needs.autoformat.result == 'success' ||
       needs.autoformat.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Run Flake8
        # --max-line-length must match autopep8's limit so the two tools agree.
        # Configure once in setup.cfg [flake8] or pyproject.toml [tool.flake8]
        # to avoid repeating this flag here and in the autoformat step.
        run: flake8 . --max-line-length 88

  # ── 3. Test ───────────────────────────────────────────────────────────────
  # Runs only after both autoformat and lint succeed (or autoformat is skipped).
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - autoformat
      - lint
    if: |
      always() &&
      (needs.autoformat.result == 'success' ||
       needs.autoformat.result == 'skipped') &&
      needs.lint.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FOE with Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ \
            --cov=foe \
            --cov-report=term-missing \
            --cov-fail-under=80
