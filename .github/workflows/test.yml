name: Python Tests & Linting

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'foe/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Code Quality (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          pip install flake8

      - name: Run Flake8
        # This will use your .flake8 config file automatically
        run: flake8 .

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: lint # Only run tests if linting passes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep testing other versions even if one fails
      matrix:
        # Testing across the full spectrum of supported versions in 2026
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FOE with Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the [dev] extra we defined in pyproject.toml
          pip install -e .[dev]

      - name: Run Pytest with Coverage
        # --doctest-modules is great because it tests the examples in your docstrings!
        run: |
          pytest tests/ --doctest-modules --cov=foe --cov-report=term-missing
