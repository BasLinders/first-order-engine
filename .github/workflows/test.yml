name: Python Tests & Linting

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'foe/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  autoformat:
    name: Auto-fix Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install formatters
        run: pip install autopep8 autoflake

      - name: Remove unused imports
        run: |
          autoflake --in-place --recursive \
            --remove-all-unused-imports \
            .

      - name: Fix style issues
        run: |
          autopep8 --in-place --recursive \
            --max-line-length 88 \
            --select W291,W293,W391,E302,E303,E261,E501 \
            .

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5.0.0
        with:
          commit_message: "style: auto-fix flake8 cosmetic issues"

  lint:
    name: Code Quality (Flake8)
    runs-on: ubuntu-latest
    needs: autoformat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FOE with Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=foe --cov-report=term-missing
