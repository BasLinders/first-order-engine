[metadata]
name = axiom
version = 0.1.0
description = A library for A/B testing and statistical inference
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
# This matches your pyproject.toml logic
package_dir =
    = .
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    scipy
    pandas
    # Add other core dependencies here

[options.packages.find]
# This prevents the 'tests' and 'gcp' folders from being installed 
# as python packages when someone runs 'pip install axiom'
exclude =
    tests*
    gcp*

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = --verbose

[flake8]
max-line-length = 88
exclude = .git,__pycache__,build,dist
